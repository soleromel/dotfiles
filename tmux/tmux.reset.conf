# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^W list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind : command-prompt
bind * setw synchronize-panes
bind S choose-session
bind X swap-pane    # swap current pane with the marked one (prefix m)
bind K send-keys "clear"\; send-keys "Enter"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Restore tmux defaults previously overridden (explicit, since unbind-key -a is off)
bind c new-window
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind w choose-tree -Zw
bind '"' split-window
bind , command-prompt -I "#W" { rename-window "%%" }
bind . command-prompt -T target { move-window -t "%%" }
bind - delete-buffer
bind = choose-buffer -Z
unbind |
